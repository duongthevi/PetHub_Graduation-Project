spring.application.name=Pet-Ecommerce
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:2424}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:5MB}

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
app.jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}
app.jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME:refreshToken}
app.jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:false}
app.jwt.refresh-cookie-same-site=${JWT_REFRESH_COOKIE_SAME_SITE:Lax}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

app.checkout.shipping-fee=${SHIPPING_FEE:30000}
app.checkout.free-shipping-threshold=${FREE_SHIPPING_THRESHOLD:500000}

app.payment.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.payment.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay/return}
app.payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.payment.vnpay.version=2.1.0
app.payment.vnpay.pending-minutes=${VNPAY_PENDING_MINUTES:15}
app.payment.vnpay.expiry-check-ms=${VNPAY_EXPIRY_CHECK_MS:60000}

app.ai.base-url=${AI_BASE_URL:http://localhost:11434/v1}
app.ai.api-key=${AI_API_KEY:ollama}
app.ai.chat-model=${AI_CHAT_MODEL:qwen2.5:3b-instruct}
app.ai.embedding-model=${AI_EMBEDDING_MODEL:nomic-embed-text}
app.ai.top-k=${AI_TOP_K:5}
app.ai.minimum-score=${AI_MINIMUM_SCORE:0.2}
app.ai.chunk-size=${AI_CHUNK_SIZE:900}
app.ai.chunk-overlap=${AI_CHUNK_OVERLAP:120}

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@petshop.local}
app.mail.reset-url=${PASSWORD_RESET_URL:http://localhost:5173/reset-password}
app.mail.reset-token-minutes=${PASSWORD_RESET_TOKEN_MINUTES:15}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}
management.health.mail.enabled=${MAIL_ENABLED:false}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

aws.s3.access=${AWS_S3_ACCESS}
aws.s3.secret=${AWS_S3_SECRET}
aws.s3.bucket=${AWS_S3_BUCKET:petshop-ecommerce}
aws.s3.region=${AWS_S3_REGION:ap-southeast-2}
