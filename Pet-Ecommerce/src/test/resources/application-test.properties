spring.datasource.url=jdbc:h2:mem:pet_ecommerce;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=test-secret-that-is-longer-than-thirty-two-bytes
app.jwt.access-token-expiration-seconds=900
app.jwt.refresh-token-expiration-days=30
app.jwt.refresh-cookie-name=refreshToken
app.jwt.refresh-cookie-secure=false
app.jwt.refresh-cookie-same-site=Lax
app.cors.allowed-origins=http://localhost:5173

aws.s3.access=test
aws.s3.secret=test
aws.s3.bucket=test
aws.s3.region=ap-southeast-2

app.ai.api-key=
app.payment.vnpay.tmn-code=
app.payment.vnpay.hash-secret=
app.mail.enabled=false
